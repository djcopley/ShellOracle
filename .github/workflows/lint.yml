name: Lint
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: pypa/hatch@install
      - name: Run ruff linter
        run: hatch check code
      - name: Run ruff formatter
        run: hatch check fmt
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: pypa/hatch@install
      - name: Run mypy
        run: hatch run types:check
